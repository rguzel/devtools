version: "3.8"

services:
  codetoolbox-ui:
    image: nginx:alpine
    container_name: codetoolbox-ui
    security_opt:
      - apparmor:unconfined
    ports:
      - "3110:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./html/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - codetoolbox-api
    restart: unless-stopped

  codetoolbox-api:
    image: codetoolbox-api:latest
    container_name: codetoolbox-api
    security_opt:
      - apparmor:unconfined
    expose:
      - "8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:14b}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-deepseek-coder:latest}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
