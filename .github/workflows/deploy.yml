name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy frontend
        run: |
          rsync -az --delete html/ /home/admincik/codetoolbox/html/

      - name: Deploy API
        run: |
          rsync -az --delete api/ /home/admincik/codetoolbox/api/

      - name: Restart containers
        run: |
          cd /home/admincik/codetoolbox
          docker compose restart
